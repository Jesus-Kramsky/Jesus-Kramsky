# Workflow para compilar y desplegar una app de Angular en GitHub Pages de forma nativa
name: Deploy Angular to Pages

on:
  # Se ejecuta al hacer push a la rama principal
  push:
    branches: ["main"]

  # Permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:

# Configura los permisos del GITHUB_TOKEN para permitir el despliegue nativo
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos en conflicto
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Trabajo de compilación (Build)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Angular
        # Usamos la variable automática de GitHub Pages para el --base-href de forma dinámica
        run: npx ng build --configuration=production --base-href="${{ steps.pages.outputs.base_path }}/"

      - name: Upload artifact
        # Sube la carpeta de salida generada por Angular (ajusta el nombre de tu proyecto si difiere)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/Jesus-Kramsky-portfolio/browser'

  # Trabajo de despliegue (Deploy)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
